
; This file defines the Speedbreaker's behaviour.
; If you delete this file, SpeedFixer disables itself.
;
; The UNEDITED VALUES in this file match the game's vanilla (i.e. unmodified) values.
; SpeedFixer corrects invalid values; parameters you omit get their vanilla values.
; Each value in this file must be a decimal or whole number in [some range].



[Activation]

; Constraints        (max. duration unlimited if parameter omitted)
minCarSpeed = 48.0 ; [>=0] speed required (in kph) to activate
maxDuration = 10.0 ; [>=0] max. duration (in seconds) when fully charged



[Recharging]

; Passive             (disabled if both parameters omitted)
minCarSpeed = 161.0 ; [>=0] speed required (in kph)     to trigger
passiveTime =  25.0 ; [>=0] time  required (in seconds) to complete

; Active
minDriftSpeed = 56.0 ; [>=0]  speed      required (in kph)     to trigger
minSlipAngle  = 30.0 ; [0-90] slip angle required (in degrees) to trigger
activeScale   =  1.0 ; [any]  relative (to vanilla) effectiveness



[Physics]

; Multipliers
timeScale    = 4.0 ; [>=1] dilation for simulation time
carMassScale = 2.0 ; [>=0] car mass for collisions
gravityScale = 3.0 ; [any] gravity  for downforce

; Transitions
toDilationScale   = 1.0 ; [>=0] relative (to vanilla) delay to   full dilation
fromDilationScale = 1.0 ; [>=0] relative (to vanilla) delay from full dilation

; Front wheels
frontFrictionBoost = 75.0 ; [>=0]  boost (in percent) to steering friction
maxSteeringAngle   = 60.0 ; [0-90] max. steering angle (in degrees)

; Other forces
aeroDragReduction =  75.0 ; [0-100]  reduction (in percent) of aerodynamic drag
slipGripReduction = 100.0 ; [15-100] reduction (in percent) of forward grip when slipping